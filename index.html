<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0,
               user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="format-detection" content="telephone=no" />
<meta name="theme-color" content="#000000" />
<title>FPV Sim — Acro Trainer</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ======================= 3D VIEWPORT ======================= -->
<canvas id="scene" playsinline></canvas>

<!-- ======================= FPV OSD =========================== -->
<div id="hud">
  <div id="crosshair"><span></span></div>

  <div class="osd osd-tl">
    <div class="row"><span class="lbl">MODE</span><span class="val" id="osd-mode">ACRO</span></div>
    <div class="row"><span class="lbl">ARM</span><span class="val" id="osd-arm">DISARMED</span></div>
    <div class="row"><span class="lbl">BATT</span><span class="val" id="osd-volt">25.2V</span><span class="val dim" id="osd-mah">0mAh</span></div>
    <div class="row"><span class="lbl">TIME</span><span class="val" id="osd-timer">00:00</span></div>
    <div class="row"><span class="lbl">SPD</span><span class="val" id="osd-speed">0 km/h</span></div>
    <div class="row"><span class="lbl">ALT</span><span class="val" id="osd-alt">0.0 m</span></div>
  </div>

  <div class="osd osd-bc">
    <div class="thr-wrap">
      <div class="thr-bar"><div class="thr-fill" id="thr-fill"></div></div>
      <div class="thr-txt" id="osd-thr">THR 0%</div>
    </div>
  </div>
</div>

<!-- ======================= BUTTONS =========================== -->
<div id="buttons">
  <button id="btn-arm"    class="btn">ARM</button>
  <button id="btn-reset"  class="btn">RESET</button>
  <button id="btn-spring" class="btn tiny">THR: HOLD</button>
  <button id="btn-sound"  class="btn tiny">SND: ON</button>
  <button id="btn-map"    class="btn tiny">LOAD MAP</button>
  <button id="btn-resume" class="btn tiny" style="display:none">RESUME</button>
  <button id="btn-forget" class="btn tiny" style="display:none">FORGET</button>
  <button id="btn-lap"    class="btn tiny">LAP RESET</button>
  <button id="btn-gfx"    class="btn tiny">GFX: MED</button>
</div>

<!-- ======================= JOYSTICKS ========================= -->
<div id="stick-left"  class="stick">
  <div class="stick-label">THR · YAW</div>
  <div class="knob"></div>
</div>
<div id="stick-right" class="stick">
  <div class="stick-label">PITCH · ROLL</div>
  <div class="knob"></div>
</div>

<!-- ======================= CRASH OVERLAY ===================== -->
<div id="lap-timer">
  <div class="lt-state">READY</div>
  <div class="lt-time">--.-</div>
  <div class="lt-best">BEST --.-</div>
</div>
<div id="vignette"></div>

<div id="crash" class="hidden">
  <div class="crash-title">CRASHED</div>
  <div class="crash-sub">tap respawn to try again</div>
  <button id="btn-respawn" class="btn big">RESPAWN</button>
</div>

<!-- ======================= HELP ============================== -->
<div id="help">
  <b>Touch</b> — left stick: throttle / yaw &nbsp;·&nbsp; right stick: pitch / roll<br>
  <b>Keys</b> — W/S throttle · A/D yaw · ↑↓←→ pitch/roll · Space arm · R reset
  <div class="close" id="help-close">✕</div>
</div>

<!-- Three.js (UMD build — works from file:// as well as http://) -->
<input id="map-file" type="file" accept=".glb,.gltf" style="display:none" />
<!-- Multi-CDN Three.js bootstrap + on-screen error reporting -->
<script>
(function () {
  // three.js r128 — last comfortably-old version that ships BOTH
  // build/three.min.js AND examples/js/loaders/GLTFLoader.js as UMD.
  var V = '0.128.0';
  var THREE_URLS = [
    'https://cdn.jsdelivr.net/npm/three@' + V + '/build/three.min.js',
    'https://unpkg.com/three@' + V + '/build/three.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'
  ];
  var GLTF_URLS = [
    'https://cdn.jsdelivr.net/npm/three@' + V + '/examples/js/loaders/GLTFLoader.js',
    'https://unpkg.com/three@' + V + '/examples/js/loaders/GLTFLoader.js'
  ];
  var APP = [
    'js/config.js', 'js/audio.js', 'js/world.js', 'js/physics.js',
    'js/input.js', 'js/hud.js', 'js/racing.js', 'js/loader.js', 'js/main.js'
  ];

  function showError(msg) {
    var d = document.getElementById('fpv-error-overlay');
    if (!d) {
      d = document.createElement('div');
      d.id = 'fpv-error-overlay';
      d.style.cssText =
        'position:fixed;bottom:0;left:0;right:0;z-index:9999;' +
        'background:rgba(120,0,0,0.92);color:#fff;' +
        'font:11px/1.4 monospace;padding:6px 8px;' +
        'max-height:40vh;overflow:auto;';
      (document.body || document.documentElement).appendChild(d);
    }
    d.textContent += (d.textContent ? '\n' : '') + msg;
  }

  window.addEventListener('error', function (e) {
    showError('[ERROR] ' + (e.message || 'unknown') +
              (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    var msg;
    if (r instanceof Error) {
      msg = r.name + ': ' + (r.message || '(empty)');
    } else if (r && r.message) {
      msg = String(r.name || '') + ' ' + String(r.message);
    } else if (r === undefined) {
      msg = 'undefined';
    } else if (r === null) {
      msg = 'null';
    } else {
      msg = String(r);
    }
    showError('[PROMISE] ' + msg);
  });

  function tryLoad(urls, cb) {
    var i = 0;
    function next() {
      if (i >= urls.length) return cb(null);
      var s = document.createElement('script');
      s.src = urls[i++];
      s.onload  = function () { cb(s.src); };
      s.onerror = next;
      document.head.appendChild(s);
    }
    next();
  }

  function loadApp() {
    var i = 0;
    function next() {
      if (i >= APP.length) return;
      var s = document.createElement('script');
      s.src = APP[i++];
      s.onload  = next;
      s.onerror = function () { showError('Failed to load ' + s.src); next(); };
      document.head.appendChild(s);
    }
    next();
  }

  function start() {
    tryLoad(THREE_URLS, function (src) {
      if (!src || typeof THREE === 'undefined') {
        showError('FATAL: three.js could not be loaded from any CDN.');
        return;
      }
      console.log('three.js loaded from', src);
      tryLoad(GLTF_URLS, function (gsrc) {
        if (!gsrc) console.warn('GLTFLoader unavailable — LOAD MAP will not work');

        var UTILS_URLS = [
          'https://cdn.jsdelivr.net/npm/three@' + V + '/examples/js/utils/BufferGeometryUtils.js',
          'https://unpkg.com/three@' + V + '/examples/js/utils/BufferGeometryUtils.js'
        ];

        tryLoad(UTILS_URLS, function (usrc) {
          if (!usrc || !THREE.BufferGeometryUtils) {
            console.warn('BufferGeometryUtils unavailable — mesh merging disabled');
          }
          loadApp();
        });
      });
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>

</body>
</html>
